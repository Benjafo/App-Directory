networks:
  web:
    external: true
services:
  landing:
    image: nginx:alpine
    container_name: landing
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=Host(`benjafo.com`) || Host(`www.benjafo.com`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing.middlewares=www-to-apex"
      - "traefik.http.middlewares.www-to-apex.redirectregex.regex=^https?://www\\.benjafo\\.com/(.*)"
      - "traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://benjafo.com/$${1}"
      - "traefik.http.middlewares.www-to-apex.redirectregex.permanent=true"